[project]
name = "autoevolve"
version = "0.1.0"
description = "Automated iterative improvement through self-play"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
plot = ["matplotlib", "numpy"]
animate = ["matplotlib", "numpy", "pillow"]
dev = ["pytest", "ruff"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
